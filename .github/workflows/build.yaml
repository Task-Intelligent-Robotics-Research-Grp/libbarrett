name: build libbarrett

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build_libbarrett:
    runs-on: ${{ inputs.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: apt update and upgrade
      run: |
        sudo apt update
        sudo apt upgrade -y

    - name: Install dependencies
      run: |
        sudo apt install libgsl-dev libconfig++-dev

    - name: Patch libconfig
      run: |
        cd /usr/include
        sudo patch < ${{github.workspace}}/libconfig.patch

    - name: Configure CMake
      run: |
        cmake -B ${{github.worksapce}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmkae --build ${{github.workspace}}/build --config Release
